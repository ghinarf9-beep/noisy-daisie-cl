<!DOCTYPE html>
<html lang="en" style="scroll-behavior: smooth;">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home - NoisyDaisieChampionLeague</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        html { overflow-y: scroll; }
        .scroller::-webkit-scrollbar { display: none; }
        .scroller { -ms-overflow-style: none; scrollbar-width: none; }
        .card-container { perspective: 1200px; }
        .tilt-card { transform-style: preserve-3d; transition: transform 0.15s ease-out, box-shadow 0.2s ease; }
    </style>
</head>
<body class="bg-slate-950 text-white font-sans overflow-x-hidden selection:bg-pink-500">

    <!-- NAVBAR ASLI -->
   <nav class="bg-slate-900/80 backdrop-blur-md sticky top-0 z-50 border-b border-slate-800">
        <div class="max-w-full mx-auto px-4 sm:px-6 lg:px-12 h-20 flex items-center justify-between relative">
            
            <div class="text-lg sm:text-xl font-black tracking-wider bg-gradient-to-r from-pink-500 to-purple-500 bg-clip-text text-transparent truncate max-w-[70%]">
                NOISYDAISIE CL
            </div>
            
            <div class="hidden md:flex items-center space-x-8 font-medium">
                <a href="index.html" class="hover:text-pink-500 transition">Home</a>
                <a href="matches.html" class="hover:text-pink-500 transition">Matches</a>
                <a href="teams.html" class="hover:text-pink-500 transition">Teams</a>
                <a href="schedule.html" class="hover:text-pink-500 transition">Schedule</a>
                
                <a href="register.html" class="bg-gradient-to-r from-pink-500 to-purple-500 hover:from-pink-600 hover:to-purple-600 text-white font-bold px-5 py-2.5 rounded-xl transition duration-300 shadow-[0_0_15px_rgba(236,72,153,0.15)] hover:shadow-[0_0_25px_rgba(236,72,153,0.45)] hover:scale-105 transform">
                    Join League
                </a>
            </div>

            <button id="burger-btn" class="md:hidden block focus:outline-none cursor-pointer relative z-[60] p-2 min-w-[44px] min-h-[44px] flex items-center justify-center">
                <svg class="w-7 h-7 text-white hover:text-pink-500 transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M4 6h16M4 12h16M4 18h16"></path>
                </svg>
            </button>
        </div>

        <div id="mobile-menu" class="hidden absolute top-20 left-0 w-full bg-slate-900 p-6 flex flex-col space-y-4 shadow-2xl md:hidden border-t border-slate-800 z-50">
            <a href="index.html" class="hover:text-pink-500 transition py-2 border-b border-slate-800/50">Home</a>
            <a href="matches.html" class="hover:text-pink-500 transition py-2 border-b border-slate-800/50">Matches</a>
            <a href="teams.html" class="hover:text-pink-500 transition py-2 border-b border-slate-800/50">Teams</a>
            <a href="schedule.html" class="hover:text-pink-500 transition py-2 border-b border-slate-800/50">Schedule</a>
            <a href="register.html" class="bg-gradient-to-r from-pink-500 to-purple-500 text-white font-bold py-3 rounded-xl text-center shadow-[0_0_15px_rgba(236,72,153,0.2)] block mt-4">
                Join League
            </a>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 py-16">
        <div class="text-center mb-16">
            <h1 class="text-4xl md:text-6xl font-black uppercase tracking-tight bg-gradient-to-r from-pink-500 via-purple-500 to-indigo-500 bg-clip-text text-transparent">
                STARTING LINE-UP
            </h1>
            <p class="text-slate-400 mt-3 text-sm md:text-base">Scroll horizontally to view team captains, click on a card to see full squad details.</p>
        </div>

        <div id="players-scroller" class="scroller flex space-x-6 overflow-x-auto pb-10 px-4 snap-x card-container"></div>
    </main>

    <!-- POPUP MODAL -->
    <div id="player-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-md z-[100] hidden flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-800 w-full max-w-lg rounded-2xl p-6 md:p-8 shadow-2xl relative">
            <button id="close-modal" class="absolute top-4 right-4 text-slate-400 hover:text-white font-bold text-xl cursor-pointer">&times;</button>
            <div class="flex items-center space-x-4 mb-6 border-b border-slate-800 pb-4">
                <div id="modal-team-logo" class="w-14 h-14 rounded-full overflow-hidden bg-slate-950 flex items-center justify-center text-white font-black text-lg border border-slate-800"></div>
                <div>
                    <h2 id="modal-team-name" class="text-2xl font-black text-transparent bg-clip-text bg-gradient-to-r from-pink-500 to-purple-500"></h2>
                    <p id="modal-team-captain" class="text-sm text-slate-400"></p>
                </div>
            </div>
            <h4 class="text-xs font-bold text-pink-400 tracking-wider uppercase mb-3">Player Squad List</h4>
            <div id="modal-players-list" class="space-y-2 max-h-60 overflow-y-auto pr-2"></div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const scroller = document.getElementById('players-scroller');
            const modal = document.getElementById('player-modal');
            const closeModal = document.getElementById('close-modal');
            
            // Dummy Teams (Bisa dikasih URL foto tim sungguhan kalau mau)
            const defaultTeams = [
                {
                    name: "Real Madrid", captain: "Carlo Ancelotti (Coach)", isDummy: true,
                    gradient: "from-amber-500/10 via-slate-900 to-slate-950", numberColor: "text-slate-800/20 group-hover:text-amber-500/20",
                    tagColor: "text-amber-500", hoverName: "group-hover:text-amber-400", badgeColor: "from-amber-500 to-yellow-600", initials: "RM",
                    teamPhoto: null, // Kalau mau dipasang foto skuad madrid, paste link fotonya di sini
                    players: [
                        { name: "Vinícius Jr", number: "7" },
                        { name: "Kylian Mbappé", number: "9" },
                        { name: "Jude Bellingham", number: "5" },
                        { name: "Federico Valverde", number: "8" }
                    ]
                },
                {
                    name: "FC Barcelona", captain: "Hansi Flick (Coach)", isDummy: true,
                    gradient: "from-blue-500/10 via-slate-900 to-slate-950", numberColor: "text-slate-800/20 group-hover:text-blue-500/20",
                    tagColor: "text-blue-400", hoverName: "group-hover:text-blue-400", badgeColor: "from-blue-600 to-red-600", initials: "FCB",
                    teamPhoto: null,
                    players: [
                        { name: "Lamine Yamal", number: "19" },
                        { name: "Raphinha", number: "11" },
                        { name: "Robert Lewandowski", number: "9" }
                    ]
                }
            ];

            const localTeams = JSON.parse(localStorage.getItem('registeredTeams')) || [];
            const allTeams = [...defaultTeams, ...localTeams];
            
            function applyTiltEffect(card) {
                card.addEventListener('mousemove', function(e) {
                    const cardRect = card.getBoundingClientRect();
                    const rotateX = -((e.clientY - cardRect.top - cardRect.height / 2) / (cardRect.height / 2)) * 15;
                    const rotateY = ((e.clientX - cardRect.left - cardRect.width / 2) / (cardRect.width / 2)) * 15;
                    card.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale(1.02)`;
                });
                card.addEventListener('mouseleave', function() {
                    card.style.transform = `rotateX(0deg) rotateY(0deg) scale(1)`;
                });
            }

            allTeams.forEach(function(team) {
                const playerCard = document.createElement('div');
                playerCard.className = "tilt-card min-w-[280px] md:min-w-[320px] bg-slate-900 rounded-2xl overflow-hidden border border-slate-800/80 snap-center cursor-pointer relative group";
                if(!team.isDummy) playerCard.classList.add('border-pink-500/30');

                const words = team.name.split(' ');
                const finalInitials = ((words[0] ? words[0][0] : '') + (words[1] ? words[1][0] : '')).toUpperCase() || 'FC';
                const firstPlayerName = (team.players && team.players[0]) ? team.players[0].name : "None";
                const firstPlayerNumber = (team.players && team.players[0]) ? team.players[0].number : "0";

                // BACKGROUND FOTO CLUB: Render gambarnya kalau di-upload sama user
                let bgPhotoHTML = '';
                if (team.teamPhoto) {
                    bgPhotoHTML = `<img src="${team.teamPhoto}" class="absolute inset-0 w-full h-full object-cover opacity-25 group-hover:opacity-40 transition-opacity duration-300 mix-blend-luminosity group-hover:mix-blend-normal">`;
                }

                const cardGradient = team.gradient || "from-pink-500/10 via-slate-900 to-slate-950";
                const giantNumberColor = team.numberColor || "text-slate-800/20 group-hover:text-pink-500/30";

                playerCard.innerHTML = `
                    <div class="h-[420px] bg-gradient-to-b ${cardGradient} p-6 flex flex-col justify-end relative overflow-hidden">
                        ${bgPhotoHTML}
                        <div class="absolute top-4 left-6 text-xl font-black tracking-wider text-white/20 uppercase">${finalInitials}</div>
                        <div class="absolute top-4 right-6 text-7xl font-black transition-colors duration-300 ${giantNumberColor}">${firstPlayerNumber}</div>
                        <div class="z-20 relative">
                            <span class="text-xs font-bold uppercase tracking-widest text-pink-500">${team.name}</span>
                            <h3 class="text-2xl font-black mt-1 text-white group-hover:text-pink-400 transition-colors">${firstPlayerName}</h3>
                            <span class="inline-block text-[10px] uppercase font-bold border px-2 py-0.5 rounded mt-2 bg-pink-950/80 border-pink-500/30 text-pink-400 group-hover:bg-pink-500 group-hover:text-white transition duration-300">View Squad</span>
                        </div>
                    </div>
                `;
                
                applyTiltEffect(playerCard);
                
                playerCard.addEventListener('click', function() {
                    document.getElementById('modal-team-name').innerText = team.name;
                    document.getElementById('modal-team-captain').innerText = team.isDummy ? team.captain : "Manager: " + team.captain;
                    document.getElementById('modal-team-logo').innerHTML = `<span class="text-pink-500 font-bold">${finalInitials}</span>`;

                    const listContainer = document.getElementById('modal-players-list');
                    listContainer.innerHTML = '';
                    
                    if (team.players && team.players.length > 0) {
                        team.players.forEach(p => {
                            const row = document.createElement('div');
                            row.className = "w-full flex items-center justify-between bg-slate-950/60 border border-slate-800 px-4 py-3 rounded-xl";
                            row.innerHTML = `
                                <span class="font-medium text-slate-200">${p.name}</span>
                                <span class="bg-gradient-to-r from-pink-500 to-purple-500 text-white font-black text-xs px-2.5 py-1 rounded-md min-w-[35px] text-center block">${p.number}</span>
                            `;
                            listContainer.appendChild(row);
                        });
                    }
                    modal.classList.remove('hidden');
                });
                scroller.appendChild(playerCard);
            });

            closeModal.addEventListener('click', () => modal.classList.add('hidden'));
        });
    </script>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const burgerBtn = document.getElementById('burger-btn');
            const mobileMenu = document.getElementById('mobile-menu');
            
            if (burgerBtn && mobileMenu) {
                burgerBtn.addEventListener('click', function(e) {
                    e.stopPropagation(); 
                    mobileMenu.classList.toggle('hidden');
                    console.log('Burger menu clicked!');
                });

                document.addEventListener('click', function(e) {
                    if (!mobileMenu.classList.contains('hidden') && e.target !== burgerBtn && !burgerBtn.contains(e.target)) {
                        mobileMenu.classList.add('hidden');
                    }
                });
            } else {
                console.error('Burger button or mobile-menu element not found in HTML!');
            }
        });
    </script>
</body>
</html>
