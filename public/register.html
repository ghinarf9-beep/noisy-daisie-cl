<!DOCTYPE html>
<html lang="id" style="scroll-behavior: smooth;">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Team - NoisyDaisieChampionLeague</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Paksa scrollbar vertikal selalu muncul biar layout sama rata */
        html {
            overflow-y: scroll;
        }
    </style>
</head>
<body class="bg-slate-950 text-white font-sans overflow-x-hidden selection:bg-pink-500">

    <nav class="bg-slate-900/80 backdrop-blur-md sticky top-0 z-50 border-b border-slate-800">
        <div class="max-w-full mx-auto px-6 lg:px-12 h-20 flex items-center justify-between">
            <div class="text-xl font-black tracking-wider bg-gradient-to-r from-pink-500 to-purple-500 bg-clip-text text-transparent">
                NOISYDAISIE CL
            </div>
            
            <div class="hidden md:flex items-center space-x-8 font-medium">
                <a href="index.html" class="hover:text-pink-500 transition">Home</a>
                <a href="matches.html" class="hover:text-pink-500 transition">Matches</a>
                <a href="teams.html" class="hover:text-pink-500 transition">Teams</a>
                <a href="schedule.html" class="hover:text-pink-500 transition">Schedule</a>
                
                <a href="register.html" class="bg-gradient-to-r from-pink-500 to-purple-500 hover:from-pink-600 hover:to-purple-600 text-white font-bold px-5 py-2.5 rounded-xl transition duration-300 shadow-[0_0_15px_rgba(236,72,153,0.15)] hover:shadow-[0_0_25px_rgba(236,72,153,0.45)] hover:scale-105 transform">
                    Join League
                </a>
            </div>

            <button id="burger-btn" class="md:hidden block focus:outline-none cursor-pointer relative z-[60]">
                <svg class="w-8 h-8 text-white hover:text-pink-500 transition" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
                </svg>
            </button>
        </div>

        <div id="mobile-menu" class="hidden absolute top-20 left-0 w-full bg-slate-900 p-6 flex flex-col space-y-4 shadow-2xl md:hidden border-t border-slate-800 z-50">
            <a href="index.html" class="hover:text-pink-500 transition">Home</a>
            <a href="matches.html" class="hover:text-pink-500 transition">Matches</a>
            <a href="teams.html" class="hover:text-pink-500 transition">Teams</a>
            <a href="schedule.html" class="hover:text-pink-500 transition">Schedule</a>
            <a href="register.html" class="bg-gradient-to-r from-pink-500 to-purple-500 text-white font-bold py-3 rounded-xl text-center shadow-[0_0_15px_rgba(236,72,153,0.2)]">
                Join League
            </a>
        </div>
    </nav>

    <main class="max-w-3xl mx-auto px-4 py-16">
        <div class="text-center mb-12">
            <h1 class="text-4xl md:text-5xl font-black uppercase tracking-tight bg-gradient-to-r from-pink-500 via-purple-500 to-indigo-500 bg-clip-text text-transparent">
                REGISTER YOUR CLUB
            </h1>
            <p class="text-slate-400 mt-2 text-sm md:text-base">Daftarkan tim sepak bola terbaikmu dan ikut serta memperebutkan takhta juara!</p>
        </div>

        <form id="register-form" class="bg-slate-900 border border-slate-800 rounded-3xl p-6 md:p-10 space-y-6 shadow-2xl">
            <div>
                <label class="block text-sm font-semibold mb-2 text-slate-300">Nama Tim</label>
                <input type="text" id="team-name" required placeholder="Contoh: Garuda FC" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3.5 focus:outline-none focus:border-pink-500 transition text-white">
            </div>

            <div>
                <label class="block text-sm font-semibold mb-2 text-slate-300">Nama Manager</label>
                <input type="text" id="team-manager" required placeholder="Nama lengkap manager" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3.5 focus:outline-none focus:border-pink-500 transition text-white">
            </div>

            <div>
                <label class="block text-sm font-semibold mb-2 text-slate-300">URL Logo Tim (Gambar Bebas)</label>
                <input type="url" id="team-logo" required placeholder="https://example.com/logo.png" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3.5 focus:outline-none focus:border-pink-500 transition text-white">
            </div>

            <button type="submit" class="w-full bg-gradient-to-r from-pink-500 to-purple-500 hover:from-pink-600 hover:to-purple-600 font-bold py-4 rounded-xl transition duration-300 transform hover:scale-[1.01] shadow-lg shadow-pink-500/20 text-center cursor-pointer">
                Submit & Daftarkan Tim
            </button>
        </form>
    </main>

    <!-- KODE PROSES SUBMIT FORM REGISTER -->
    <script>
        document.getElementById('register-form').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const name = document.getElementById('team-name').value;
            const manager = document.getElementById('team-manager').value;
            const logoUrl = document.getElementById('team-logo').value;
            
            const newTeam = { name, manager, logoUrl };
            
            // Ambil data yang lama atau buat array baru jika kosong
            const localTeams = JSON.parse(localStorage.getItem('registeredTeams')) || [];
            localTeams.push(newTeam);
            
            // Simpan kembali data yang baru ke localStorage
            localStorage.setItem('registeredTeams', JSON.stringify(localTeams));
            
            alert('Selamat! Tim ' + name + ' berhasil terdaftar di liga.');
            
            // Redirect langsung ke halaman teams untuk melihat hasilnya
            window.location.href = 'teams.html';
        });
    </script>

    <!-- KODE BURGER MENU -->
    <script>
      const burgerBtn = document.getElementById('burger-btn');
      const mobileMenu = document.getElementById('mobile-menu');

      if (burgerBtn && mobileMenu) {
        burgerBtn.addEventListener('click', () => {
          mobileMenu.classList.toggle('hidden');
        });
      }
    </script>

    <!-- MAIN.JS DI PALING BAWAH -->
    <script type="module" src="/src/main.js"></script>
</body>
</html>
