<!DOCTYPE html>
<html lang="en" style="scroll-behavior: smooth;">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matches - NoisyDaisieChampionLeague</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Paksa scrollbar vertikal selalu muncul biar layout sama rata */
        html {
            overflow-y: scroll;
        }
    </style>
</head>
<body class="bg-slate-950 text-white font-sans overflow-x-hidden selection:bg-pink-500">

    <nav class="bg-slate-900/80 backdrop-blur-md sticky top-0 z-50 border-b border-slate-800">
        <div class="max-w-full mx-auto px-4 sm:px-6 lg:px-12 h-20 flex items-center justify-between relative">
            
            <div class="text-lg sm:text-xl font-black tracking-wider bg-gradient-to-r from-pink-500 to-purple-500 bg-clip-text text-transparent truncate max-w-[70%]">
                NOISYDAISIE CL
            </div>
            
            <div class="hidden md:flex items-center space-x-8 font-medium">
                <a href="index.html" class="hover:text-pink-500 transition">Home</a>
                <a href="matches.html" class="hover:text-pink-500 transition">Matches</a>
                <a href="teams.html" class="hover:text-pink-500 transition">Teams</a>
                <a href="schedule.html" class="hover:text-pink-500 transition">Schedule</a>
                
                <a href="register.html" class="bg-gradient-to-r from-pink-500 to-purple-500 hover:from-pink-600 hover:to-purple-600 text-white font-bold px-5 py-2.5 rounded-xl transition duration-300 shadow-[0_0_15px_rgba(236,72,153,0.15)] hover:shadow-[0_0_25px_rgba(236,72,153,0.45)] hover:scale-105 transform">
                    Join League
                </a>
            </div>

            <button id="burger-btn" class="md:hidden block focus:outline-none cursor-pointer relative z-[60] p-2 min-w-[44px] min-h-[44px] flex items-center justify-center">
                <svg class="w-7 h-7 text-white hover:text-pink-500 transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M4 6h16M4 12h16M4 18h16"></path>
                </svg>
            </button>
        </div>

        <div id="mobile-menu" class="hidden absolute top-20 left-0 w-full bg-slate-900 p-6 flex flex-col space-y-4 shadow-2xl md:hidden border-t border-slate-800 z-50">
            <a href="index.html" class="hover:text-pink-500 transition py-2 border-b border-slate-800/50">Home</a>
            <a href="matches.html" class="hover:text-pink-500 transition py-2 border-b border-slate-800/50">Matches</a>
            <a href="teams.html" class="hover:text-pink-500 transition py-2 border-b border-slate-800/50">Teams</a>
            <a href="schedule.html" class="hover:text-pink-500 transition py-2 border-b border-slate-800/50">Schedule</a>
            <a href="register.html" class="bg-gradient-to-r from-pink-500 to-purple-500 text-white font-bold py-3 rounded-xl text-center shadow-[0_0_15px_rgba(236,72,153,0.2)] block mt-4">
                Join League
            </a>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 py-16">
        <div class="text-center mb-16">
            <h1 class="text-4xl md:text-6xl font-black uppercase tracking-tight bg-gradient-to-r from-pink-500 via-purple-500 to-indigo-500 bg-clip-text text-transparent">
                MATCHES RESULTS
            </h1>
            <p class="text-slate-400 mt-3 text-sm md:text-base">Dedicated page to track league match scores and results.</p>
        </div>

        <div id="matches-list" class="max-w-4xl mx-auto space-y-6 px-4">
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 flex flex-col md:flex-row items-center justify-between gap-6 hover:border-pink-500/30 transition duration-300">
                <div class="flex items-center space-x-4 w-full md:w-1/3 justify-center md:justify-end">
                    <span class="font-bold text-lg md:text-xl">Real Madrid</span>
                    <div class="w-12 h-12 bg-amber-500/10 rounded-full flex items-center justify-center text-amber-500 font-black">RM</div>
                </div>
                <div class="text-center w-full md:w-1/3 bg-slate-950/60 py-3 px-6 rounded-xl border border-slate-800">
                    <div class="text-3xl font-black tracking-widest bg-gradient-to-r from-pink-500 to-purple-500 bg-clip-text text-transparent">3 - 1</div>
                    <div class="text-[10px] text-green-400 font-bold uppercase tracking-wider mt-1">Full Time</div>
                </div>
                <div class="flex items-center space-x-4 space-x-reverse w-full md:w-1/3 justify-center md:justify-start">
                    <div class="w-12 h-12 bg-blue-500/10 rounded-full flex items-center justify-center text-blue-500 font-black">FCB</div>
                    <span class="font-bold text-lg md:text-xl">FC Barcelona</span>
                </div>
            </div>
        </div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const matchesList = document.getElementById('matches-list');
            const localTeams = JSON.parse(localStorage.getItem('registeredTeams')) || [];
            
            localTeams.forEach(function(team) {
                const matchCard = document.createElement('div');
                matchCard.className = "bg-slate-900 border border-pink-500/20 rounded-2xl p-6 flex flex-col md:flex-row items-center justify-between gap-6 hover:border-pink-500/40 transition duration-300";
                
                matchCard.innerHTML = `
                    <div class="flex items-center space-x-4 w-full md:w-1/3 justify-center md:justify-end">
                        <span class="font-bold text-lg md:text-xl text-pink-400">${team.name}</span>
                        <div class="w-12 h-12 bg-pink-500/10 rounded-full flex items-center justify-center text-pink-500 font-black">NEW</div>
                    </div>
                    <div class="text-center w-full md:w-1/3 bg-slate-950/60 py-3 px-6 rounded-xl border border-slate-800">
                        <div class="text-3xl font-black tracking-widest text-slate-400">0 - 0</div>
                        <div class="text-[10px] text-amber-400 font-bold uppercase tracking-wider mt-1">Live / Preview</div>
                    </div>
                    <div class="flex items-center space-x-4 space-x-reverse w-full md:w-1/3 justify-center md:justify-start">
                        <div class="w-12 h-12 bg-amber-500/10 rounded-full flex items-center justify-center text-amber-500 font-black">RM</div>
                        <span class="font-bold text-lg md:text-xl">Real Madrid</span>
                    </div>
                `;
                matchesList.appendChild(matchCard);
            });
        });
    </script>

    <script type="module" src="/src/main.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const burgerBtn = document.getElementById('burger-btn');
            const mobileMenu = document.getElementById('mobile-menu');

            if (burgerBtn && mobileMenu) {
                burgerBtn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    mobileMenu.classList.toggle('hidden');
                });
                document.addEventListener('click', function(e) {
                    if (!mobileMenu.classList.contains('hidden') && e.target !== burgerBtn && !burgerBtn.contains(e.target)) {
                        mobileMenu.classList.add('hidden');
                    }
                });
            }
        });
    </script>
</body>
</html>
